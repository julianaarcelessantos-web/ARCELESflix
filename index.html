<!JU INDICA html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luan Santana – Site de Músicas</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>Luan Santana – Sertanejo</h1>
        <p>Clipes, músicas e imagens do cantor</p>
    </header>

    <section class="banner">
        <img src="https://i.ytimg.com/vi/9K2pRRaYF0c/maxresdefault.jpg" alt="Luan Santana Show">
    </section>

    <section class="musicas">
        <h2>🎵 Músicas e Videoclipes</h2>

        <div class="video">
            <h3>Morena</h3>
            <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/9K2pRRaYF0c" 
                title="YouTube video player" 
                frameborder="0" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="video">
            <h3>Escreve Aí</h3>
            <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/K4DyBUG242c" 
                title="YouTube video player" 
                frameborder="0" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="video">
            <h3>Eu, Você, o Mar e Ela</h3>
            <iframe width="560" height="315" 
                src="https://www.youtube.com/embed/8Ji1C9Y1mqg" 
                title="YouTube video player" 
                frameborder="0" 
                allowfullscreen>
            </iframe>
        </div>
    </section>

    <section class="galeria">
        <h2>📸 Galeria de Imagens</h2>

        <div class="grid">
            <img src="https://i.scdn.co/image/ab6761610000e5eb4cd14a2fdbef674e7dc86d51" alt="Luan Santana">
            <img src="https://i.ytimg.com/vi/h9t1wVSYk_I/maxresdefault.jpg" alt="Show do Luan">
            <img src="https://i.ytimg.com/vi/JWj1xkCIWmk/maxresdefault.jpg" alt="Luan Santana Cantando">
        </div>
    </section>

    <footer>
        <p>Site demonstrativo criado para fins de estudo • Feito com ❤️</p>
    </footer>

</body>
</html>
